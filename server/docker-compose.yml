# Локальный Nakama + PostgreSQL для разработки.
# Запуск: cd server && docker compose up --build
# Пароли здесь только для локальной машины, на серверах — свои.

name: fishing-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    build:
      # Контекст — корень репозитория, чтобы в образ попали и модули, и shared/data
      context: ..
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama?sslmode=disable &&
        exec /nakama/nakama --config /nakama/data/local.yml --database.address postgres:localdb@postgres:5432/nakama?sslmode=disable
    ports:
      - "127.0.0.1:7349:7349"   # gRPC API
      - "7350:7350"             # клиентский API; открыт в локальную сеть, чтобы подключаться с телефона
      - "127.0.0.1:7351:7351"   # веб-консоль, только с этой машины
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
